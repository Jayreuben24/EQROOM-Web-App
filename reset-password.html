<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Applies the saved dark/light choice before first paint, so the page
         never flashes light-mode then flips to dark. -->
    <script>(function(){try{var t=localStorage.getItem('coeqroom-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-EQROOM - Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Stylesheet (same one login.html uses -- this page reuses its card,
         input, button, and modal-status styling) -->
    <link rel="stylesheet" href="Styles/styles-login.css">
    <script type="module" src="Scripts/reset-password.js" defer></script>
    <script src="Scripts\supabase-config.js" defer></script>
</head>

<body>
    <!-- Floating background blur orbs for glassmorphism -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-pressed="false" aria-label="Toggle dark mode">
        <i data-lucide="moon" data-theme-icon style="width: 18px; height: 18px;"></i>
    </button>

    <header class="brand-header">
        <h1>CO-<span>EQROOM</span></h1>
        <p>Equipment & Room Management Portal</p>
    </header>

    <main class="scene" style="perspective: none;">
        <section class="login-card" aria-label="Reset password form" style="position: static;">
            <div class="card-header">
                <h2>Set a New Password</h2>
                <p>Choose a new password for your account</p>
            </div>

            <div id="resetStatusMessage"></div>

            <form id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="reset-new-password">New Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="reset-new-password" class="form-control"
                            placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="reset-new-password"
                            aria-label="Toggle password visibility">
                            <i data-lucide="eye" class="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reset-confirm-password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="shield-check" class="input-icon"></i>
                        <input type="password" id="reset-confirm-password" class="form-control"
                            placeholder="Repeat password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="reset-confirm-password"
                            aria-label="Toggle password visibility">
                            <i data-lucide="eye" class="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="resetSubmitBtn">
                    <span>Update Password</span>
                    <i data-lucide="check" style="width: 18px; height: 18px;"></i>
                </button>
            </form>

            <footer class="card-footer">
                <a href="login.html" class="flip-btn" style="text-decoration: none;">Back to Sign In</a>
            </footer>
        </section>
    </main>

    <!-- UI & Animation Logic (icon hydration + the eye/toggle-password
         wiring already in animations.js, reused as-is) -->
    <script src="Scripts/animations.js"></script>
    <script src="Scripts/theme.js"></script>
</body>

</html>
