<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-EQROOM - Login & Register</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="Styles/styles-login.css">
    <script type="module" src="Scripts/login-auth.js" defer></script>
</head>

<body>
    <!-- Floating background blur orbs for glassmorphism -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <header class="brand-header">
        <h1>CO-<span>EQROOM</span></h1>
        <p>Equipment & Room Management Portal</p>
    </header>

    <main class="scene">
        <div class="auth-card" id="authCard">
            <!-- FRONT: Login Card -->
            <section class="login-card" aria-label="Login form">
                <div class="card-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your account</p>
                </div>

                <form id="loginForm" action="/login" method="post" novalidate>
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" class="input-icon"></i>
                            <input type="text" id="username" name="username" class="form-control"
                                placeholder="e.g. ritchie.bading.plpasig.edu.ph" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" data-target="password"
                                aria-label="Toggle password visibility">
                                <i data-lucide="eye" class="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="loginSubmitBtn">
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                    </button>
                </form>

                <footer class="card-footer">
                    Don't have an account?
                    <button type="button" class="flip-btn" id="goToRegister">Sign Up</button>
                </footer>
            </section>

            <!-- BACK: Register Card -->
            <section class="register-card" aria-label="Register form">
                <div class="card-header">
                    <h2>Create Account</h2>
                    <p>Join CO-EQROOM to reserve & manage assets</p>
                </div>

                <form id="registerForm" action="/register" method="post" novalidate>
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user-check" class="input-icon"></i>
                            <input type="text" id="full-name" name="fullName" class="form-control"
                                placeholder="e.g. Ritchie Bading" autocomplete="name" required>
                        </div>
                        <div class="form-group">
                            <label for="new-username">Username or Email</label>
                            <div class="input-wrapper">
                                <i data-lucide="user" class="input-icon"></i>
                                <input type="text" id="new-username" name="username" class="form-control"
                                    placeholder="Choose a username or email" autocomplete="username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="new-password">Password</label>
                            <div class="input-wrapper">
                                <i data-lucide="lock" class="input-icon"></i>
                                <input type="password" id="new-password" name="password" class="form-control"
                                    placeholder="At least 8 characters" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" data-target="new-password"
                                    aria-label="Toggle password visibility">
                                    <i data-lucide="eye" class="eye-icon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <div class="input-wrapper">
                                <i data-lucide="shield-check" class="input-icon"></i>
                                <input type="password" id="confirm-password" name="confirmPassword" class="form-control"
                                    placeholder="Repeat password" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" data-target="confirm-password"
                                    aria-label="Toggle password visibility">
                                    <i data-lucide="eye" class="eye-icon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary" id="registerSubmitBtn">
                            <span>Create Account</span>
                            <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
                        </button>
                </form>

                <footer class="card-footer">
                    Already have an account?
                    <button type="button" class="flip-btn" id="goToLogin">Sign In</button>
                </footer>
            </section>
        </div>
    </main>

    <!-- UI & Animation Logic -->
    <script src="Scripts/animations.js"></script>
</body>

</html>
